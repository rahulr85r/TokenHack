name: tokenhack-index

# Rebuild the TokenHack symbol index on every push to main.
# Commits the updated index back to the repo if it changed.
# Skips re-trigger when the bot itself committed the index.

on:
  push:
    branches: [main]
    paths-ignore:
      - '.claude/skills/tokenhack/index/**'
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tokenhack-index-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rebuild-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install indexer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .claude/skills/tokenhack/requirements.txt

      - name: Rebuild index (incremental)
        run: python3 .claude/skills/tokenhack/indexer.py

      - name: Commit index if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain .claude/skills/tokenhack/index/)" ]]; then
            git add .claude/skills/tokenhack/index/
            git commit -m "[tokenhack] update index"
            git push
          else
            echo "No index changes; nothing to commit."
          fi
