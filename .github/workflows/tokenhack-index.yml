name: tokenhack-index

# Rebuild the TokenHack symbol index on every push to main.
# Commits the updated index back to the repo if it changed.
# Skips re-trigger when the bot itself committed the index.

on:
  push:
    branches: [main]
    paths-ignore:
      - '.claude/skills/tokenhack/index/**'
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      force:
        description: "Full rebuild (ignore the incremental hash cache)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: tokenhack-index-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rebuild-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install indexer dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .claude/skills/tokenhack/requirements.txt

      - name: Rebuild index
        # --include-self because this IS the TokenHack repo; consumer repos
        # should run the indexer without this flag so the skill's own
        # router/adapters don't pollute their retrieval surface.
        # Incremental by default; --force on a manual dispatch with force=true.
        run: python3 .claude/skills/tokenhack/indexer.py --include-self ${{ inputs.force && '--force' || '' }}

      - name: Open or update index-update PR
        # Branch protection on main blocks direct pushes from the bot, so the
        # bot pushes to a feature branch and opens (or refreshes) a PR.
        # Index updates are mechanical — safe to one-click-merge or auto-merge.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -z "$(git status --porcelain .claude/skills/tokenhack/index/)" ]]; then
            echo "No index changes; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B tokenhack/index-update
          git add .claude/skills/tokenhack/index/
          git commit -m "[tokenhack] update index"
          git push --force origin tokenhack/index-update
          # Create the PR only if no OPEN one exists for this branch. `gh pr view
          # <branch>` returns the most recent PR regardless of state, so once an
          # index PR has merged it would wrongly suppress every future one — list
          # open PRs explicitly instead.
          if [[ -z "$(gh pr list --head tokenhack/index-update --state open --json number --jq '.[0].number')" ]]; then
            gh pr create \
              --base main \
              --head tokenhack/index-update \
              --title "[tokenhack] update index" \
              --body $'Automated index rebuild from CI.\n\nMechanical change — safe to merge after a quick sanity check.'
          fi
